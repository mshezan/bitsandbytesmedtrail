services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medtrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medtrail}
      POSTGRES_DB: ${POSTGRES_DB:-medtrail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medtrail} -d ${POSTGRES_DB:-medtrail}"]
      interval: 3s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  minio:
    image: elestio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medtrail}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medtrailsecret}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ./api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://medtrail:medtrail@db:5432/medtrail}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medtrail}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-medtrailsecret}
      MINIO_BUCKET: ${MINIO_BUCKET:-medtrail}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-change-me-32-byte-key-for-demo!!}
      JWT_SECRET: ${JWT_SECRET:-change-me-demo-jwt-secret}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_OTP: ${DEMO_OTP:-123456}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WEB_API_URL: ${WEB_API_URL:-http://api:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  miniodata:
  web_node_modules:
