services:
  - type: web
    name: medtrail-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medtrail-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_OTP
        value: "123456"
      - key: CORS_ORIGINS
        value: https://bitsandbytesmedtrail.vercel.app
      - key: WEB_BASE_URL
        value: https://bitsandbytesmedtrail.vercel.app

databases:
  - name: medtrail-db
    plan: free
    databaseName: medtrail
    user: medtrail
